<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zan AI MVP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — navy top bar with language switch and plan meter, tab strip, one working pane per tool, pricing pane, checkout dialog */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --ink:#0f1b3d; --muted:#5a6480; --line:#dde1ea;
  --navy:#13265c; --navy-ink:#eef1f8; --gold:#c8963a; --gold-soft:#f6ecd8;
  --ok:#2f7d5b; --ok-soft:#e3f2ea; --warn:#9a6b12; --warn-soft:#fbf0d9; --bad:#a33a2a; --bad-soft:#f8e3df;
  --display:"Montserrat","Noto Sans",system-ui,sans-serif;
  --body:"Noto Sans",system-ui,-apple-system,sans-serif;
  --mono:"Noto Sans Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1122; --surface:#131b31; --ink:#e7ebf5; --muted:#9aa4bd; --line:#26304b;
  --navy:#0a1330; --navy-ink:#e9edf7; --gold:#e0b25a; --gold-soft:#3a2f18;
  --ok:#5fc095; --ok-soft:#173527; --warn:#e3b55a; --warn-soft:#3a2f14; --bad:#ef8a78; --bad-soft:#3d1d18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1122; --surface:#131b31; --ink:#e7ebf5; --muted:#9aa4bd; --line:#26304b;
  --navy:#0a1330; --navy-ink:#e9edf7; --gold:#e0b25a; --gold-soft:#3a2f18;
  --ok:#5fc095; --ok-soft:#173527; --warn:#e3b55a; --warn-soft:#3a2f14; --bad:#ef8a78; --bad-soft:#3d1d18; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}

.top{background:var(--navy);color:var(--navy-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:19px}
.badge{font-family:var(--mono);font-size:11px;border:1px solid rgba(233,237,247,.3);border-radius:4px;padding:2px 6px;font-weight:400}
.right{display:flex;align-items:center;gap:14px}
.lang{display:flex;border:1px solid rgba(233,237,247,.3);border-radius:6px;overflow:hidden}
.lang button{background:none;border:0;color:var(--navy-ink);font-size:12px;font-weight:600;padding:4px 8px;cursor:pointer;opacity:.7}
.lang button[aria-pressed="true"]{background:var(--gold);color:#16120a;opacity:1}
.plan{display:flex;align-items:center;gap:10px;font-size:13px;background:none;border:0;color:inherit;cursor:pointer;padding:0}
.plan .pname{font-weight:700;color:var(--gold)}
.meter{width:80px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.meter i{display:block;height:100%;background:var(--gold)}
@media (max-width:620px){.plan .lbl,.meter{display:none}.brand .badge{display:none}}

.tabs{display:flex;gap:4px;padding-block:14px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.pane{padding-block:20px 40px}
.note{font-size:13px;color:var(--muted)}
.mode{display:flex;gap:8px;align-items:flex-start;background:var(--gold-soft);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:7px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--navy);color:#fff}
:root[data-theme="dark"] .btn-primary{background:var(--gold);color:#16120a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-primary{background:var(--gold);color:#16120a}}
.btn-gold{background:var(--gold);color:#16120a}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}

/* chat */
.chat{display:flex;flex-direction:column;gap:14px;min-height:300px}
.msg{max-width:88%;padding:12px 14px;border-radius:12px;min-width:0;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:3px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.ai p{margin:0 0 8px}.msg.ai p:last-child{margin:0}
.msg.ai ul,.msg.ai ol{margin:4px 0 8px;padding-left:20px}
.msg .who{font-size:12px;font-weight:600;color:var(--gold);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.thinking{display:inline-flex;gap:4px}.thinking i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--gold)}
.composer{display:flex;gap:8px;margin-top:16px;position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;height:46px}
.limit{border:1px solid var(--gold);background:var(--gold-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.limit p{margin:0}

/* forms */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid2>*{min-width:0}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea.field{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:9px 11px;width:100%}
textarea.field{min-height:220px;resize:vertical;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.result-empty{color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:6px;justify-content:center;align-items:center;min-height:200px;text-align:center}

/* risks */
.score{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;flex-wrap:wrap}
.score b{font-family:var(--display);font-size:18px}
.lvl-high{background:var(--bad-soft);color:var(--bad)}
.lvl-medium{background:var(--warn-soft);color:var(--warn)}
.lvl-low{background:var(--ok-soft);color:var(--ok)}
.risk{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.risk .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.risk .head b{font-size:14px}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.risk p{margin:0;font-size:14px}
.risk .law{font-family:var(--mono);font-size:12px;color:var(--muted)}
.risk .fix{font-size:13px;background:var(--bg);border-radius:6px;padding:8px 10px}

.doc{white-space:pre-wrap;font-size:14px;background:var(--bg);border-radius:8px;padding:14px;max-height:520px;overflow:auto;overflow-wrap:anywhere}
.err{color:var(--bad);font-size:13px}

/* pricing */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph p{margin:6px 0 0;color:var(--muted)}
.period{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.period button{border:0;background:none;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.period button[aria-pressed="true"]{background:var(--navy);color:#fff}
.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:960px){.plans{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.plans{grid-template-columns:1fr}}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;min-width:0}
.pcard.hot{border:2px solid var(--gold)}
.pcard.cur{box-shadow:0 0 0 2px var(--ok) inset}
.tag{position:absolute;top:-11px;left:16px;background:var(--gold);color:#16120a;font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;text-transform:uppercase;letter-spacing:.04em}
.pcard h3{font-size:18px}
.pcard .who{font-size:13px;color:var(--muted);margin-top:-6px}
.price{font-family:var(--display);font-size:24px;font-weight:700}
.price small{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.pcard ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13.5px;flex:1}
.pcard li{display:flex;gap:8px}.pcard li::before{content:"✓";color:var(--ok);font-weight:700}
.curlbl{font-size:13px;font-weight:700;color:var(--ok);text-align:center;padding:10px 0}
.pay-strip{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.pay-strip span.m{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;color:var(--ink);font-weight:600}
.faq{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.faq{grid-template-columns:1fr}}
.faq div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px}
.faq b{display:block;margin-bottom:4px}

/* checkout */
dialog{border:0;border-radius:14px;padding:0;width:min(460px,calc(100vw - 32px));background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(8,14,32,.55)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted)}
.sum{background:var(--bg);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.methods{display:flex;flex-direction:column;gap:8px}
.method{display:flex;flex-direction:row;align-items:center;gap:12px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;color:var(--ink);font-weight:600;font-size:14px}
.method input{width:auto;margin:0;accent-color:var(--gold)}
.method small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.method:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}
.mico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;color:#fff}
.demo-pay{font-size:12px;color:var(--muted);background:var(--bg);border-radius:6px;padding:8px 10px}
.center{text-align:center;align-items:center}
.okc{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:32px;font-weight:700}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#fff;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;z-index:20;max-width:calc(100vw - 32px)}
/* auth */
.auth{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;display:grid;grid-template-columns:1fr 1fr}
@media (max-width:820px){.auth{grid-template-columns:1fr}}
.auth-side{background:var(--navy);color:var(--navy-ink);padding:max(40px,env(safe-area-inset-top,0px)) 48px 40px;display:flex;flex-direction:column;gap:28px;justify-content:center}
@media (max-width:820px){.auth-side{padding:max(24px,env(safe-area-inset-top,0px)) 20px 24px;gap:16px}.auth-side .bens{display:none}}
.auth-side .brand{font-size:24px}
.auth-side h1{font-size:clamp(26px,3.4vw,38px);line-height:1.2}
.auth-side h1 em{font-style:normal;color:var(--gold)}
.auth-side p{margin:0;color:#c9d3ea}
.bens{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.bens li{display:flex;gap:12px;align-items:center}
.bens li span{width:30px;height:30px;border-radius:8px;background:rgba(200,150,58,.18);color:var(--gold);display:grid;place-items:center;font-weight:700;flex:none}
.auth-main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px calc(32px + env(safe-area-inset-bottom,0px));gap:16px}
.auth-main .lang{border-color:var(--line)}
.auth-main .lang button{color:var(--ink)}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:9px;padding:4px}
.seg button{border:0;background:none;border-radius:7px;padding:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.roles label{flex-direction:row;justify-content:center;text-align:center;border:1px solid var(--line);border-radius:8px;padding:8px 4px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.roles input{position:absolute;opacity:0;pointer-events:none}
.roles label:has(input:checked){border-color:var(--gold);background:var(--gold-soft)}
.agree{flex-direction:row;align-items:flex-start;gap:8px;font-weight:400;font-size:12.5px}
.agree input{width:auto;margin-top:3px;accent-color:var(--gold)}
.pw{position:relative}.pw input{padding-right:44px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--muted);font-size:12px;padding:4px}
.switch{font-size:13px;color:var(--muted);text-align:center}
.switch button{background:none;border:0;color:var(--gold);font-weight:700;cursor:pointer;padding:0}
.user{display:flex;align-items:center;gap:8px;font-size:13px}
.ava{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#16120a;display:grid;place-items:center;font-weight:700;font-size:13px}
.out{background:none;border:1px solid rgba(233,237,247,.3);border-radius:6px;color:var(--navy-ink);font-size:12px;padding:4px 8px;cursor:pointer}
@media (max-width:620px){.user .uname{display:none}}
footer{padding-block:24px 40px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="auth" id="auth" hidden>
  <aside class="auth-side">
    <div class="brand"><svg width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4v22M9 27h14M6 9h20"/><path d="M6 9l-4 9a4 4 0 0 0 8 0zM26 9l-4 9a4 4 0 0 0 8 0z"/></svg>Zan AI</div>
    <h1 data-i="a_h"></h1>
    <p data-i="a_sub"></p>
    <ul class="bens"><li><span>§</span><b data-i="b1"></b></li><li><span>✓</span><b data-i="b2"></b></li><li><span>✎</span><b data-i="b3"></b></li></ul>
  </aside>
  <div class="auth-main">
    <div class="lang" role="group" aria-label="Language"><button data-lang="kk">ҚАЗ</button><button data-lang="ru">РУС</button><button data-lang="en">ENG</button></div>
    <div class="auth-card">
      <div class="seg" role="tablist"><button type="button" data-am="reg" data-i="a_reg"></button><button type="button" data-am="login" data-i="a_login"></button></div>
      <form id="regForm" novalidate style="display:flex;flex-direction:column;gap:12px">
        <label><span data-i="f_name"></span><input id="rName" autocomplete="name"></label>
        <label><span data-i="f_email"></span><input id="rEmail" type="email" autocomplete="email" placeholder="you@mail.kz"></label>
        <label><span data-i="f_pass"></span><span class="pw"><input id="rPass" type="password" autocomplete="new-password"><button type="button" data-eye data-i="show"></button></span></label>
        <label><span data-i="f_pass2"></span><input id="rPass2" type="password" autocomplete="new-password"></label>
        <div><div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px" data-i="f_role"></div>
          <div class="roles"><label><input type="radio" name="role" value="biz" checked><span data-i="r_biz"></span></label><label><input type="radio" name="role" value="lawyer"><span data-i="r_lawyer"></span></label><label><input type="radio" name="role" value="citizen"><span data-i="r_citizen"></span></label></div></div>
        <label class="agree"><input type="checkbox" id="rAgree"><span data-i="f_agree"></span></label>
        <div class="err" id="regErr" role="alert"></div>
        <button class="btn btn-gold" type="submit" data-i="a_reg_btn"></button>
        <p class="note" style="margin:0;text-align:center" data-i="a_free"></p>
        <div class="switch"><span data-i="a_have"></span> <button type="button" data-am="login" data-i="a_login"></button></div>
      </form>
      <form id="loginForm" novalidate hidden style="display:flex;flex-direction:column;gap:12px">
        <label><span data-i="f_email"></span><input id="lEmail" type="email" autocomplete="email" placeholder="you@mail.kz"></label>
        <label><span data-i="f_pass"></span><span class="pw"><input id="lPass" type="password" autocomplete="current-password"><button type="button" data-eye data-i="show"></button></span></label>
        <div class="err" id="loginErr" role="alert"></div>
        <button class="btn btn-gold" type="submit" data-i="a_login_btn"></button>
        <div class="switch"><span data-i="a_no"></span> <button type="button" data-am="reg" data-i="a_to_reg"></button></div>
      </form>
    </div>
    <p class="note" style="margin:0;max-width:420px;text-align:center" data-i="a_note"></p>
  </div>
</div>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4v22M9 27h14M6 9h20"/><path d="M6 9l-4 9a4 4 0 0 0 8 0zM26 9l-4 9a4 4 0 0 0 8 0z"/></svg>
      Zan AI <span class="badge">MVP</span>
    </div>
    <div class="right">
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="kk">ҚАЗ</button><button data-lang="ru">РУС</button><button data-lang="en">ENG</button>
      </div>
      <button class="plan" id="planBtn" type="button">
        <span class="pname" id="planName">Free</span><span class="lbl" id="quotaTxt"></span>
        <span class="meter" id="meter"><i id="quotaBar" style="width:100%"></i></span>
      </button>
      <div class="user"><span class="ava" id="ava">?</span><span class="uname" id="uname"></span><button class="out" id="logout" type="button" data-i="logout"></button></div>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="ask" data-i="tab_ask"></button>

(() => {
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
                set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
function md(s){
  const lines = esc(s).split(/\n/); let out = "", list = null;
  const inline = t => t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<i>$2</i>").replace(/`(.+?)`/g,"<code>$1</code>");
  const close = () => { if(list){ out += `</${list}>`; list = null; } };
  for (const raw of lines){
    const l = raw.trim(); let m;
    if (!l){ close(); continue; }
    if ((m = l.match(/^[-•*]\s+(.*)/))){ if(list!=="ul"){ close(); out+="<ul>"; list="ul"; } out+=`<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^\d+[.)]\s+(.*)/))){ if(list!=="ol"){ close(); out+="<ol>"; list="ol"; } out+=`<li>${inline(m[1])}</li>`; continue; }
    close();
    const h = l.replace(/^#{1,4}\s+/,"");
    out += h!==l ? `<p><b>${inline(h)}</b></p>` : `<p>${inline(l)}</p>`;
  }
  close(); return out;
}

/* AI (Google Gemini) через Netlify Function /api/ask — ключ хранится на сервере, не здесь */
async function apiSample(input, opts = {}){
  const messages = typeof input === "string" ? [{role:"user", content:input}] : input.map(m => ({role:m.role, content:m.content}));
  let res;
  try{
    res = await fetch("/api/ask", { method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({ messages, max_tokens: opts.maxTokens || 2000 }), signal: opts.signal });
  }catch(e){ const er = new Error(e.message); er.code = e.name === "AbortError" ? "cancelled" : "network"; throw er; }
  if (!res.ok){
    const er = new Error("api " + res.status); er.code = res.status === 429 ? "rate_limited" : "api_error";
    let raw = ""; try{ raw = await res.text(); console.warn("Zan AI API:", raw); }catch(_){}
    let msg = raw; try{ let j = JSON.parse(raw); if (Array.isArray(j)) j = j[0] || {}; msg = (j.error && (j.error.message || j.error)) || j.message || raw; }catch(_){}
    er.detail = res.status + ": " + String(msg || res.statusText).slice(0, 300);
    throw er;
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "";
  try{
    for(;;){
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0){
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        for (const line of chunk.split("\n")){
          if (!line.startsWith("data:")) continue;
          let ev; try{ ev = JSON.parse(line.slice(5)); }catch(_){ continue; }
          if (ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta"){
            text += ev.delta.text; if (opts.onText) opts.onText({ text, delta: ev.delta.text });
          } else if (ev.type === "error"){
            const er = new Error((ev.error && ev.error.message) || "error");
            er.code = ev.error && ev.error.type === "overloaded_error" ? "rate_limited" : "api_error"; er.detail = er.message; throw er;
          }
        }
      }
    }
  }catch(e){
    if (e.name === "AbortError"){ const er = new Error("cancelled"); er.code = "cancelled"; er.text = text; throw er; }
    e.text = e.text || text; throw e;
  }
  return { text };
}
apiSample.json = async (prompt, opts = {}) => {
  const { text } = await apiSample(prompt + "\n\nВерни только валидный JSON, без пояснений и без ```.", { ...opts, maxTokens: 3000 });
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  try{ return JSON.parse(text.slice(a, b + 1)); }
  catch(_){ const er = new Error("bad json"); er.code = "invalid_json"; throw er; }
};

function errText(e){
  switch(e && e.code){
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled": setDemo(); return t("demo_r");
    case "rate_limited": return t("e_rate");
    case "invalid_json": return t("e_json");
    case "cancelled": return "";
    default: return t("e_net") + (e && e.detail ? " [" + e.detail + "]" : "");
  }
}

function renderChips(){

  box.innerHTML = Object.keys(EX).map(id => `<button class="chip" type="button">${esc(EX[id][lang])}</button>`).join("");

let turns = [], askCtl = null;
const chat = $("#chat"), q = $("#q");
$("#askForm").onsubmit = e => { e.preventDefault(); ask(); };
q.addEventListener("keydown", e => { if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); ask(); } });
$("#stopBtn").onclick = () => askCtl && askCtl.abort();
function bubble(role, html){
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = role==="ai" ? `<div class="who">Zan AI</div><div class="body">${html}</div>` : html;
  chat.appendChild(d); d.scrollIntoView({block:"end", behavior:"smooth"});
  return d;
}
async function ask(){
  const text = q.value.trim(); if (!text) return;
  if (!canUse()){ bubble("ai", limitHTML()); return; }
  q.value = ""; const ex = $("#examples"); if (ex) ex.remove();
  bubble("user", esc(text));
  const b = bubble("ai", `<span class="thinking"><i></i><i></i><i></i></span>`); const body = b.querySelector(".body");
  if (!live){
    await new Promise(r => setTimeout(r, 700));
    const ans = findDemo(text);
    body.innerHTML = md(ans || t("demo_ans")); if (ans) spend(); b.scrollIntoView({block:"end"}); return;
  }
  turns.push({role:"user", content:text});
  askCtl = new AbortController();
  $("#askBtn").disabled = true; $("#stopBtn").hidden = false;
  try{
    const { text: ans } = await sample([{role:"user", content:RULES()}, ...turns.slice(-8)], {
      cache:false, signal:askCtl.signal, modelTier:"default", onText: ({text}) => { body.innerHTML = md(text); } });
    turns.push({role:"assistant", content:ans}); spend();
  }catch(e){
    const msg = errText(e);
    body.innerHTML = (e.text ? md(e.text) : "") + (msg ? `<p class="err">${esc(msg)}</p>` : "");
    turns.pop();
  }finally{ $("#askBtn").disabled = false; $("#stopBtn").hidden = true; askCtl = null; }
}

$("#docForm").onsubmit = async e => {
  e.preventDefault(); $("#docErr").textContent = "";
  const title = t("dtypes")[$("#dtype").value], p1 = $("#p1").value.trim(), p2 = $("#p2").value.trim(), city = $("#city").value.trim(), sum = $("#sum").value.trim(), det = $("#details").value.trim();
  if (!p1 || !p2){ $("#docErr").textContent = t("d_parties"); return; }
  const out = $("#docOut");
  if (!canUse()){ out.className = ""; out.innerHTML = limitHTML(); return; }
  out.className = "doc";
  if (!live){ lastDoc = demoDoc(title,p1,p2,city,sum,det); out.textContent = lastDoc; $("#copyBtn").hidden = false; spend(); return; }
  out.innerHTML = `<span class="thinking"><i></i><i></i><i></i></span>`;
  docCtl = new AbortController(); $("#docBtn").disabled = true;
  try{
    const { text } = await sample(`Ты — Zan AI. Составь черновик документа по праву Республики Казахстан.
Язык документа: ${T[lang].lang_name}.
Тип: ${title}
Сторона 1: ${p1}
Сторона 2: ${p2}
Город: ${city}
Сумма, тенге: ${sum}
Детали: ${det}
Требования: официальный деловой стиль, нумерованные разделы и пункты, реквизиты и места для подписей в конце, справедливые условия для обеих сторон, ссылки на ГК РК или ТК РК там, где это уместно. Пиши обычным текстом без Markdown (без звёздочек и решёток). Не добавляй пояснений до или после документа.`,
      { modelTier:"default", cache:false, signal:docCtl.signal, onText: ({text}) => { out.textContent = text; } });
    lastDoc = text; $("#copyBtn").hidden = false; spend();
  }catch(e){
    out.textContent = e.text || ""; $("#docErr").textContent = errText(e);
  }finally{ $("#docBtn").disabled = false; docCtl = null; }
};
$("#copyBtn").onclick = async () => {
  try{ await navigator.clipboard.writeText(lastDoc); $("#copyBtn").textContent = t("copied"); }
  catch(e){ const r = document.createRange(); r.selectNodeContents($("#docOut")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("#copyBtn").textContent = t("selected"); }
  setTimeout(() => $("#copyBtn").textContent = t("copy"), 2000);
};

/* ================= PRICING ================= */
let period = "month";
const FORM = "https://forms.gle/xjVCtBXBMEyube837";
$$(".period button").forEach(b => b.onclick = () => { period = b.dataset.period; $$(".period button").forEach(x => x.setAttribute("aria-pressed", x===b)); renderPlans(); });
function priceHTML(id){
  if (id==="free") return `<div class="price">${t("free_price")}</div>`;
  if (id==="b2b") return `<div class="price">${esc(t("by_deal"))}</div>`;
  return `<div class="price">${fmt(PRICES[id][period])}<small>${period==="month"?t("per_m"):t("per_y")}</small></div>`;
}
function renderPlans(){
  const P = t("plans");
  $("#plans").innerHTML = ["free","biz","pro","b2b"].map(id => {
    const cur = sub.plan === id;
    let action;
    if (cur) action = `<div class="curlbl">✓ ${esc(t("p_cur"))}</div>`;
    else if (id==="free") action = `<div class="curlbl" style="color:var(--muted)">—</div>`;
    else if (id==="b2b") action = `<a class="btn btn-ghost" href="${FORM}" target="_blank" rel="noopener">${esc(t("p_contact"))}</a>`;
    else action = `<button class="btn ${id==="biz"?"btn-gold":"btn-primary"}" type="button" data-buy="${id}">${esc(t("p_choose",{p:planLabel(id)}))}</button>`;
    return `<div class="pcard${id==="biz"?" hot":""}${cur?" cur":""}">${id==="biz"?`<span class="tag">${esc(t("popular"))}</span>`:""}
      <h3>${esc(id==="b2b" ? "B2B / API" : planLabel(id))}</h3><div class="who">${esc(P[id].who)}</div>
      ${priceHTML(id)}<ul>${P[id].f.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${action}</div>`;
  }).join("");
  $$("[data-buy]").forEach(b => b.onclick = () => openCheckout(b.dataset.buy));
  $("#faq").innerHTML = t("faq").map(([a,b]) => `<div><b>${esc(a)}</b>${esc(b)}</div>`).join("");
  $("#resetPlan").hidden = !paid();
}
$("#resetPlan").onclick = () => { sub = {plan:"free"}; store.set(K("zan-plan"), sub); renderQuota(); renderPlans(); };

/* checkout */
const dlg = $("#checkout"), dlgBody = $("#dlgBody");
const MI = { kaspi:["K","#e4252c"], card:["▭","#13265c"], halyk:["H","#0f7a4f"], wallet:["⌘","#111"] };
let co = null;
$("#dlgX").onclick = () => closeDlg();
dlg.addEventListener("cancel", e => { if (co && co.step==="proc") e.preventDefault(); });
function closeDlg(){ if (co && co.step==="proc") return; dlg.close(); if (co && co.step==="ok"){ co = null; openTab("ask"); } co = null; }
function openCheckout(plan){ co = {plan, period, method:"kaspi", step:"form"}; renderCo(); if (!dlg.open) dlg.showModal(); }
function nextDate(){ const d = new Date(); if (co.period==="year") d.setFullYear(d.getFullYear()+1); else d.setMonth(d.getMonth()+1); return d.toLocaleDateString(lang==="en"?"en-GB":lang==="kk"?"kk-KZ":"ru-RU"); }
function renderCo(){
  $("#dlgX").hidden = co.step==="proc";
  const amount = PRICES[co.plan][co.period], name = planLabel(co.plan), M = t("m");
  if (co.step==="form"){
    const full = PRICES[co.plan].month * 12;
    dlgBody.className = "dlg";
    dlgBody.innerHTML = `<h3>${esc(t("co_title"))}</h3>
      <div class="sum"><div><span>${esc(t("co_plan"))}</span><b>${esc(name)}</b></div>
        <div><span>${esc(t("co_period"))}</span><span>${esc(co.period==="month"?t("co_month"):t("co_year"))}</span></div>
        ${co.period==="year"?`<div><span>${esc(t("co_disc"))}</span><span>−${fmt(full-amount)}</span></div>`:""}
        <div class="tot"><span>${esc(t("co_total"))}</span><span>${fmt(amount)}</span></div></div>
      <div class="period" role="group" style="align-self:flex-start">
        <button type="button" data-cp="month" aria-pressed="${co.period==="month"}">${esc(t("p_month"))}</button>
        <button type="button" data-cp="year" aria-pressed="${co.period==="year"}">${esc(t("p_year"))}</button></div>
      <b style="font-size:14px">${esc(t("co_method"))}</b>
      <div class="methods">${Object.keys(M).map(k => `<label class="method"><input type="radio" name="pm" value="${k}" ${co.method===k?"checked":""}>
        <span class="mico" style="background:${MI[k][1]}">${MI[k][0]}</span><span>${esc(M[k][0])}<small>${esc(M[k][1])}</small></span></label>`).join("")}</div>
      <div class="demo-pay">${esc(t("co_demo"))}</div>
      <div class="row"><button class="btn btn-gold" type="button" id="payBtn" style="flex:1">${esc(t("co_pay",{s:fmt(amount)}))}</button>
        <button class="btn btn-ghost" type="button" id="coCancel">${esc(t("co_cancel"))}</button></div>`;
    dlgBody.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => { co.period = b.dataset.cp; renderCo(); });
    dlgBody.querySelectorAll("input[name=pm]").forEach(r => r.onchange = () => { co.method = r.value; });
    $("#coCancel").onclick = () => closeDlg();
    $("#payBtn").onclick = () => {
      co.step = "proc"; renderCo();
      setTimeout(() => {
        sub = {plan:co.plan, period:co.period, method:co.method, since:Date.now(), next:nextDate(), amount};
        store.set(K("zan-plan"), sub); co.step = "ok"; renderCo(); renderQuota(); renderPlans();
      }, 2200);
    };
  } else if (co.step==="proc"){
    dlgBody.className = "dlg center";
    dlgBody.innerHTML = `<div class="spin" style="margin:18px auto 4px"></div><h3>${esc(t("co_proc"))}</h3><p class="note" style="margin:0 0 14px">${esc(t("co_proc_s",{m:M[co.method][0]}))}</p>`;
  } else {
    dlgBody.className = "dlg center";
    dlgBody.innerHTML = `<div class="okc" style="margin:8px auto 0">✓</div><h3>${esc(t("co_ok"))}</h3>
      <p style="margin:0">${esc(t("co_ok_s",{p:name}))}</p>
      <div class="sum" style="width:100%;text-align:left">
        <div><span>${esc(t("co_plan"))}</span><b>${esc(name)}</b></div>
        <div><span>${esc(t("co_paid"))}</span><span>${fmt(amount)}</span></div>
        <div><span>${esc(t("co_via"))}</span><span>${esc(M[co.method][0])}</span></div>
        <div><span>${esc(t("co_next"))}</span><span>${esc(nextDate())}</span></div></div>
      <button class="btn btn-gold" type="button" id="startBtn" style="width:100%">${esc(t("co_start"))}</button>`;
    $("#startBtn").onclick = () => { const p = name; closeDlg(); toast(t("toast",{p})); };
  }
}
function toast(msg){ const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }

/* ================= LANGUAGE ================= */
function applyLang(){
  document.documentElement.lang = lang;
  $$("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===lang));
  $$("[data-i]").forEach(el => { if (el.dataset.i === "a_h") el.innerHTML = t("a_h"); else el.textContent = t(el.dataset.i); });
  $$("[data-ph]").forEach(el => { el.placeholder = t(el.dataset.ph); el.setAttribute("aria-label", t(el.dataset.ph)); });
  renderChips(); renderDocTypes(); renderQuota(); renderPlans();
  if (!lastCheck) checkEmpty(); else if (lastCheck === "demo") renderCheck(DEMO_CHECK[lang]);
  if (!lastDoc) docEmpty();
  if (!modeNote.hidden) setDemo();
  if (co && dlg.open) renderCo();
}
$$("[data-lang]").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set("zan-lang", lang); applyLang(); });

/* ================= AUTH (демо: аккаунты хранятся в браузере) ================= */
const authEl = $("#auth");
async function hashPw(email, pw){
  const str = "zan:" + email + ":" + pw;
  try{ const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h = 5381; for (const c of str) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return "d" + (h >>> 0).toString(16); }
}
function setAuthMode(m){
  $$("[data-am]").forEach(b => { if (b.closest(".seg")) b.setAttribute("aria-selected", b.dataset.am === m); });
  $("#regForm").hidden = m !== "reg"; $("#loginForm").hidden = m !== "login";
  $("#regErr").textContent = ""; $("#loginErr").textContent = "";
  (m === "reg" ? $("#rName") : $("#lEmail")).focus();
}
$$("[data-am]").forEach(b => b.onclick = () => setAuthMode(b.dataset.am));
$$("[data-eye]").forEach(b => b.onclick = () => { const i = b.previousElementSibling; const show = i.type === "password"; i.type = show ? "text" : "password"; b.textContent = t(show ? "hide" : "show"); });
function enter(u, isNew){
  user = u; store.set("zan-session", u.email);
  loadUserData(); authEl.hidden = true;
  $("#ava").textContent = (u.name.trim()[0] || "?").toUpperCase(); $("#uname").textContent = u.name;
  renderQuota(); renderPlans(); window.scrollTo({top:0});
  toast(t(isNew ? "welcome" : "hi", {n:u.name}));
}
$("#regForm").onsubmit = async e => {
  e.preventDefault(); const err = $("#regErr"); err.textContent = "";
  const name = $("#rName").value.trim(), email = $("#rEmail").value.trim().toLowerCase(), pw = $("#rPass").value, pw2 = $("#rPass2").value;
  const role = (document.querySelector("input[name=role]:checked") || {}).value || "biz";
  if (!name) return err.textContent = t("e_name");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err.textContent = t("e_email");
  if (pw.length < 6) return err.textContent = t("e_pass");
  if (pw !== pw2) return err.textContent = t("e_pass2");
  if (!$("#rAgree").checked) return err.textContent = t("e_agree");
  const users = store.get("zan-users", {});
  if (users[email]){ err.textContent = t("e_exists"); $("#lEmail").value = email; return; }
  users[email] = { name, email, role, hash: await hashPw(email, pw), created: Date.now() };
  store.set("zan-users", users);
  $("#regForm").reset();
  enter(users[email], true);
};
$("#loginForm").onsubmit = async e => {
  e.preventDefault(); const err = $("#loginErr"); err.textContent = "";
  const email = $("#lEmail").value.trim().toLowerCase(), pw = $("#lPass").value;
  if (!email || !pw) return err.textContent = t("e_empty");
  const u = store.get("zan-users", {})[email];
  if (!u) return err.textContent = t("e_nouser");
  if (u.hash !== await hashPw(email, pw)) return err.textContent = t("e_wrong");
  $("#loginForm").reset();
  enter(u, false);
};
$("#logout").onclick = () => { try{ localStorage.removeItem("zan-session"); }catch(e){} location.reload(); };

applyLang();
(() => {
  const email = store.get("zan-session", null), u = email && store.get("zan-users", {})[email];
  if (u){ user = u; loadUserData(); $("#ava").textContent = (u.name.trim()[0] || "?").toUpperCase(); $("#uname").textContent = u.name; renderQuota(); renderPlans(); }
  else { authEl.hidden = false; setAuthMode(store.get("zan-users", null) ? "login" : "reg"); }
})();
})();
